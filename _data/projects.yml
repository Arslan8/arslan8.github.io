- name: "Pieces"
  description: "Pieces is a highly programmable, language-agnostic automatic program compartmentalization framework. Pieces can be programmed to partition programs based on various criteria, including methods of isolation between compartments."
  github: "https://github.com/purseclab/Pieces"
  image: "assets/img/pieces.png"

- name: "SeRTOS"
  description: "Security Enhanced FreeRTOS (SeRTOS) is a security-enhanced version of FreeRTOS. It features compile-time privilege separation, intra-kernel isolation, and lightweight defense mechanisms tailored for resource-constrained embedded systems."
  github: "https://github.com/Arslan8/FreeRTOS"
  image: "assets/img/sertos.png"
