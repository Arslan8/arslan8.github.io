---
layout: default
---

<div class="row align-items-center g-4 mb-5">
  <div class="col-md-8">
    <h2 class="fw-bold mb-1">Arslan Khan</h2>
    <p class="text-muted mb-3">
      Assistant Professor of Computer Science and Engineering<br>
      Pennsylvania State University &bull; INSR
    </p>
    {{ content }}
  </div>
  <div class="col-md-4 text-center text-md-end">
    <img src="{{ site.github.url }}/assets/img/cover.jpeg" alt="Arslan Khan" class="img-fluid rounded-circle shadow-sm" style="width: 175px; height: 175px; object-fit: cover;">
  </div>
</div>

{% if site.data.news %}
<div class="my-5">
  <h4 class="fw-bold border-bottom pb-2 mb-3">Recent News</h4>
  <ul class="list-unstyled">
    {% for item in site.data.news %}
      <li class="mb-2 d-flex align-items-baseline">
        <span class="badge bg-light text-secondary border me-3 font-monospace" style="min-width: 85px; font-weight: 500;">{{ item.date }}</span>
        <span>{{ item.content }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
